[project]
name = "chromaswarm"
version = "0.1.0"
description = "ChromaSwarm — 12-step multi-agent orchestrator for professional frontend generation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "anthropic>=0.40",
  "langgraph>=0.2",
  "playwright>=1.48",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chromaswarm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
